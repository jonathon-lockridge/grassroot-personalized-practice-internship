# Checks that run before every commit. Install once with: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-secrets
        name: check for committed secrets
        entry: scripts/check_secrets.sh
        language: script
        pass_filenames: true
      - id: block-env-files
        name: block .env files (secrets never go in git)
        entry: ".env files must never be committed. Put the variable name in .env.example instead."
        language: fail
        files: '(^|/)\.env(\..*)?$'
        exclude: '\.env\.example$'
